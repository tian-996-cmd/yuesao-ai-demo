name: Production V1 CI

on:
  push:
    branches: [main, codex/production-v1]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jiazheng_test
          POSTGRES_USER: jiazheng
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jiazheng -d jiazheng_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://jiazheng:ci-only-password@127.0.0.1:5432/jiazheng_test
      JWT_SECRET: ci-only-jwt-secret-with-more-than-32-characters
      CORS_ORIGIN: http://localhost
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: demo2026
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify PostgreSQL starts with an empty public schema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const result = await client.query("select count(*)::int as count from pg_tables where schemaname = 'public'");
            assert.equal(result.rows[0].count, 0);
          } finally {
            await client.end();
          }
          NODE
      - run: npx tsc --noEmit
      - run: npm run test:api
      - run: npm run db:migrate
      - run: npm run db:seed
      - name: Verify seed is idempotent
        run: npm run db:seed
      - name: PostgreSQL API integration flow
        shell: bash
        run: |
          node backend/dist/server.js > /tmp/jiazheng-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat /tmp/jiazheng-api.log' EXIT
          node backend/test/integration.mjs
      - run: npm run build:production
      - run: npm run build:pages
      - run: npm run build
      - name: Build production API container
        run: docker build -f Dockerfile.api -t jiazheng-api:ci .
      - name: Build production frontend container
        run: docker build -f Dockerfile.frontend -t jiazheng-frontend:ci .
      - name: Vercel compatibility build
        run: npm run build:vercel
        env:
          VERCEL: 1
